CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_KEYBOARD_NAME="Silakka54"
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_POINTING=y

# Report the peripheral (right) half's battery to the host as well.
# Both symbols live inside `if ZMK_SPLIT_ROLE_CENTRAL`, so they only take
# effect on the lily58_left build and are inert on the right.
# NB: this changes nothing on either nice!view -- each half's widget shows
# only its own battery. The gain is macOS seeing both levels.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Default 60s is too laggy to diagnose charging behaviour; revert once done.
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=10
